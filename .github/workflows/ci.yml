name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ['1.26.x', stable]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      # Execution counts, not durations: a timed -fuzztime can report its own
      # normal expiry as "context deadline exceeded" (a race in the Go fuzz
      # coordinator). The counts match the executions the earlier 10s runs
      # completed on ubuntu-latest.
      - run: go test ./jsonpath -run '^$' -fuzz '^FuzzCompileAndEval$' -fuzztime=40000x
      - run: go test ./jsonata -run '^$' -fuzz '^FuzzCompileAndEval$' -fuzztime=14000x
      - run: go test ./internal/document -run '^$' -fuzz '^FuzzPrepareAndMaterialize$' -fuzztime=27000x

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conformance/oracle/package-lock.json
      - run: npm ci --ignore-scripts --prefix conformance/oracle
      - run: go test -tags oracle ./conformance ./jsonata

  javascript-assessment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: experiments/javascript/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -o /tmp/jsontrans-owned-assess ./cmd/assess
      - name: Full owned JavaScript assessment gates
        run: >-
          python3 run_probes.py --binary /tmp/jsontrans-owned-assess --backend owned-quickjs
          --strict --output /tmp/owned-full-gates.json
      - run: go test -run '^$' -fuzz '^FuzzStringConversion$' -fuzztime=1000x -parallel=2


  javascript-module:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: javascript/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - name: Consume packaged module outside the checkout
        run: python3 scripts/check_module.py
      - run: go test -run '^$' -fuzz '^FuzzOwnedStringConversion$' -fuzztime=200x -parallel=2
      - run: go test ./internal/quickjswasm -run '^$' -fuzz '^FuzzOwnedCompile$' -fuzztime=200x -parallel=2
      - run: go test ./internal/quickjswasm -run '^$' -fuzz '^FuzzDiagnosticRecord$' -fuzztime=1000x -parallel=2
      - run: go test -run '^$' -fuzz '^FuzzRuleLocation$' -fuzztime=1000x -parallel=2

  quickjs-guest-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild pinned guest with WASI SDK 34
        run: >-
          python3 javascript/internal/quickjswasm/guest/build.py
          --cache "$RUNNER_TEMP/quickjs-build-cache"
          --output "$RUNNER_TEMP/owned-quickjs.wasm"
      - name: Compare artifact bytes
        run: cmp javascript/internal/quickjswasm/quickjs.wasm "$RUNNER_TEMP/owned-quickjs.wasm"
