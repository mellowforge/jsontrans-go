name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ['1.26.x', stable]
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then echo "$files"; exit 1; fi
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      # Execution counts, not durations: a timed -fuzztime can report its own
      # normal expiry as "context deadline exceeded" (a race in the Go fuzz
      # coordinator). The counts match the executions the earlier 10s runs
      # completed on ubuntu-latest.
      - run: go test ./jsonpath -run '^$' -fuzz '^FuzzCompileAndEval$' -fuzztime=40000x
      - run: go test ./jsonata -run '^$' -fuzz '^FuzzCompileAndEval$' -fuzztime=14000x
      - run: go test ./internal/document -run '^$' -fuzz '^FuzzPrepareAndMaterialize$' -fuzztime=27000x

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: conformance/oracle/package-lock.json
      - run: npm ci --ignore-scripts --prefix conformance/oracle
      - run: go test -tags oracle ./conformance ./jsonata

  javascript-assessment:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/javascript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: experiments/javascript/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/assess
      - run: go test -run '^$' -fuzz '^FuzzStringConversion$' -fuzztime=1000x -parallel=2
