name: Go security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: windows-amd64
            goos: windows
            goarch: amd64
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            javascript/go.sum
            experiments/javascript/go.sum
      - name: Install pinned host scanner
        env:
          GOBIN: ${{ runner.temp }}/security-tools
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Test finding and coverage gate offline
        run: python3 -m unittest discover -s scripts -p 'test_check_go_security.py'
      - name: Scan all modules and a CGO-free public binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: >-
          python3 scripts/check_go_security.py
          --govulncheck "$RUNNER_TEMP/security-tools/govulncheck"
          --output "$RUNNER_TEMP/go-security-${{ matrix.target }}"
      - name: Retain inventory and raw scanner evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-security-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/go-security-${{ matrix.target }}/*.json
            ${{ runner.temp }}/go-security-${{ matrix.target }}/*.txt
          if-no-files-found: warn
